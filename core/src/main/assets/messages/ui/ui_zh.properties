ui.changelist.leochanges.identity_title=Leo 专属身份
ui.changelist.leochanges.identity_body=**-** 游戏正式命名为《Leo的地牢围攻》\n**-** Bundle ID 统一为 leogameone\n**-** 默认使用简体中文，并保留英文切换\n**-** 建立 Leo 远征、档案与日志专属命名体系
ui.changelist.leochanges.visual_title=高清视觉升级
ui.changelist.leochanges.visual_body=**-** 全新黑金翡翠狮王主视觉\n**-** 替换英雄与区域章节插画\n**-** 更新 iPhone、iPad 与 Mac 图标\n**-** 优化标题、安全区与横竖屏布局
ui.changelist.leochanges.feel_title=操作与打击反馈
ui.changelist.leochanges.feel_body=**-** 加入斩击、突刺、钝击差异化反馈\n**-** 增加命中震动、粒子与材质音效\n**-** 缩短移动视觉动画，让鼠标与触控响应更利落\n**-** 战斗数值与原始命中公式保持不变
ui.changelist.leochanges.fixes_body=**-** 修正标题与副标题组合的视觉居中\n**-** 修正默认中文下仍显示英文历史的问题\n**-** 补充白蛇高闪避与伏击机制说明\n**-** 完善 iPhone 四角安全区适配
