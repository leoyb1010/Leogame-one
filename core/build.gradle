apply plugin: 'java-library'

def appleBuildRoot = System.getenv('APPLE_BUILD_ROOT')
if (appleBuildRoot) {
    // Keep generated classes out of synced Documents folders. Besides being
    // substantially faster on macOS, this prevents File Provider from
    // creating duplicate " 2.class" outputs during iterative builds.
    layout.buildDirectory = file("${appleBuildRoot}/core")
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
[compileJava, compileTestJava]*.options*.compilerArgs = ['-XDstringConcat=inline']
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

dependencies {
    api project(':SPD-classes')
    implementation project(':services')
    testImplementation 'junit:junit:4.13.2'
}

// Gradle does not automatically forward command-line -D values into forked
// test JVMs. Keep the long-running Bukov gates honest by explicitly forwarding
// only their documented tuning properties.
def bukovTestProperties = [
        'bukov.seed.count',
        'bukov.firstRaidSeedCount',
        'bukov.save.iterations',
        'bukov.performance.seconds',
        'bukov.performance.e2e.seconds',
        'bukov.performance.e2e.maxP95Ms',
        'bukov.performance.e2e.maxAllocatedBytesPerFrame'
]

tasks.withType(Test).configureEach {
    bukovTestProperties.each { propertyName ->
        def propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }
}
