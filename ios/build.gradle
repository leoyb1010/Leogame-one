buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "com.mobidevelop.robovm:robovm-gradle-plugin:$robovmVersion"
    }
}

def appleBuildRoot = System.getenv('APPLE_BUILD_ROOT')
if (appleBuildRoot) {
    layout.buildDirectory = file("${appleBuildRoot}/ios")
}

// RoboVM reads this file while its plugin is applied, so it must exist before
// plugin configuration. Generating it as a later task leaves the first build
// using stale identity values from the previous checkout/build.
def robovmProps = new Properties()
robovmProps.setProperty('appName', appName)
robovmProps.setProperty('appApplePackageName', appBundleId)
robovmProps.setProperty('appVersionCode', appVersionCode.toString())
robovmProps.setProperty('appVersionName', appVersionName)
robovmProps.setProperty('appShortVersionName', (appVersionName =~ /\d+\.\d+\.\d+/)[0])
robovmProps.setProperty('appMainclass', appPackageName + ".ios.IOSLauncher")
robovmProps.setProperty('appExecutable', "IOSLauncher")
robovmProps.setProperty(
        'bukovSourceCommit',
        System.getenv('BUKOV_SOURCE_COMMIT') ?: 'unknown')
robovmProps.setProperty(
        'bukovSourceWorktree',
        System.getenv('BUKOV_SOURCE_WORKTREE') ?: 'unknown')
file("robovm.properties").withWriter {
    robovmProps.store(it, "Dynamically generated, do not commit to version control!")
}

apply plugin: "java"
apply plugin: "robovm"

robovm {
    def iosSignIdentity = System.getenv('IOS_SIGN_IDENTITY')
    def iosProvisioningProfile = System.getenv('IOS_PROVISIONING_PROFILE')
    if (iosSignIdentity) setIosSignIdentity(iosSignIdentity)
    if (iosProvisioningProfile) setIosProvisioningProfile(iosProvisioningProfile)
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

launchIPhoneSimulator.dependsOn build
launchIPadSimulator.dependsOn build
launchIOSDevice.dependsOn build
createIPA.dependsOn build

dependencies {
    implementation project(':core')
    implementation project(':services:updates:offlineUpdates')
    implementation project(':services:news:offlineNews')

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.mobidevelop.robovm:robovm-rt:$robovmVersion"
    implementation "com.mobidevelop.robovm:robovm-cocoatouch:$robovmVersion"
    //FIXME using a prior version of metalangle backend as 1.13.5+ crashes on A7 and A8 devices
    // Yes this is dangerous, the old backend seems to only work with libGDX 1.14.0 incidentally
    // Ideally the next release of libGDX will fix this and this can simply use $gdxVersion again
    implementation "com.badlogicgames.gdx:gdx-backend-robovm-metalangle:1.13.1"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-ios"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-ios"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-ios:$gdxControllersVersion"
    testImplementation 'junit:junit:4.13.2'
}
