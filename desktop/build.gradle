plugins {
    id 'org.beryx.runtime' version '2.0.1'
}

def appleBuildRoot = System.getenv('APPLE_BUILD_ROOT')
if (appleBuildRoot) {
    layout.buildDirectory = file("${appleBuildRoot}/desktop")
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

ext.appMainClass = "com.shatteredpixel.shatteredpixeldungeon.desktop.DesktopLauncher"
application.mainClass = appMainClass
def bukovBuildIdentityDir = layout.buildDirectory.dir('generated/bukov-build-identity')
def generateBukovBuildIdentity = tasks.register('generateBukovBuildIdentity') {
    def identityFile = bukovBuildIdentityDir.map { it.file('bukov-build-identity.properties') }
    outputs.file(identityFile)
    doLast {
        def output = identityFile.get().asFile
        output.parentFile.mkdirs()
        output.text = [
                "source_commit=${System.getenv('BUKOV_SOURCE_COMMIT') ?: 'unknown'}",
                "source_worktree=${System.getenv('BUKOV_SOURCE_WORKTREE') ?: 'unknown'}",
                ""
        ].join(System.lineSeparator())
    }
}
processResources {
    dependsOn generateBukovBuildIdentity
    from new File(project(':core').projectDir, "/src/main/assets")
    from new File(project(':desktop').projectDir,"/src/main/assets")
    from bukovBuildIdentityDir
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)

tasks.register('debug', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    ignoreExitValue = true

    mainClass = appMainClass
    systemProperty 'Specification-Title', appName
    systemProperty 'Implementation-Title', appPackageName
    systemProperty 'Specification-Version', appVersionName + "-INDEV"
    systemProperty 'Implementation-Version', appVersionCode

    if (osName.contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.named('run', JavaExec) {
    systemProperty 'Specification-Title', appName
    systemProperty 'Implementation-Title', appPackageName
    systemProperty 'Specification-Version', appVersionName + "-INDEV"
    systemProperty 'Implementation-Version', appVersionCode

    if (osName.contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes 'Main-Class': appMainClass
        attributes 'Specification-Title': appName
        attributes 'Implementation-Title': appPackageName
        attributes 'Specification-Version': appVersionName
        attributes 'Implementation-Version': appVersionCode
    }
}

tasks.register('release', Jar) {
    //FIXME this is now needed as of gradle 7.0, due to our weird sourceSets setup. Should see if there's a better way to do this
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }
}
installDist.dependsOn release
startScripts.dependsOn release
jpackageImage.dependsOn release

runtime {
    modules = ['java.base',
               'java.desktop',
               'jdk.unsupported',
               'jdk.crypto.cryptoki',
               'jdk.management']
    options = ['--strip-debug',
               '--compress', '2',
               '--no-header-files',
               '--no-man-pages',
               '--strip-native-commands',
               '--vm', 'server']

    jpackage {
        mainClass = appMainClass
        appVersion = (appVersionName =~ /\d+\.\d+\.\d+/)[0]
        imageName = appName
    }

    if (osName.contains('windows')) {
        //May work on Windows 7 (2009), but that's old enough that I'm only officially supporting Windows 10 (2015)
        targetPlatform("win") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_windows_hotspot_17.0.17_10.zip")
            javaHome = file("./build/jdks/win/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/win/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/windows.ico"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('linux')) {
        //May work on glibc 2.12 (2010), but that's old enough that I'm only officially supporting glibc 2.17 (2012)
        targetPlatform("linux") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_linux_hotspot_17.0.17_10.tar.gz")
            javaHome = file("./build/jdks/linux/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/linux/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/icon_256.png"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('mac')) {
        //This JDK officially supports MacOS 12 (2021), but internals suggest support for 10.12 (2016)
        def macJdkArch = osArch == 'aarch64' || osArch == 'arm64' ? 'aarch64' : 'x64'
        def macJdkHome = layout.buildDirectory.dir('jdks/mac/jdk-17.0.17+10/Contents/Home').get().asFile
        targetPlatform("mac") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_${macJdkArch}_mac_hotspot_17.0.17_10.tar.gz")
            javaHome = macJdkHome.getAbsolutePath()
            jpackage {
                jpackageHome = macJdkHome
                def macImageOptions = ["--icon", file("./src/main/assets/icons/mac.icns"),
                                       "--java-options", "-XstartOnFirstThread",
                                       "--java-options", "-XX:+IgnoreUnrecognizedVMOptions",
                                       "--mac-package-identifier", appBundleId,
                                       "--mac-app-category", "games",
                                       "--resource-dir", file("./src/main/jpackage")]
                def signingIdentity = System.getenv('MAC_SIGNING_IDENTITY')
                if (signingIdentity) {
                    macImageOptions += ["--mac-sign", "--mac-signing-key-user-name", signingIdentity]
                }
                imageOptions = macImageOptions
            }
        }
    }

}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"

    //we use LWJGL tinyFD directly to display crash messages
    implementation "org.lwjgl:lwjgl-tinyfd:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-tinyfd:$lwjglVersion:natives-windows"
    implementation "org.lwjgl:lwjgl-tinyfd:$lwjglVersion:natives-macos"
    implementation "org.lwjgl:lwjgl-tinyfd:$lwjglVersion:natives-macos-arm64"
    implementation "org.lwjgl:lwjgl-tinyfd:$lwjglVersion:natives-linux"
    implementation "org.lwjgl:lwjgl-tinyfd:$lwjglVersion:natives-linux-arm64"

    // GLFW's IME focus control first ships in the LWJGL 3.4 line. Keep every
    // transitive backend module on one native ABI instead of upgrading only
    // lwjgl-glfw and mixing it with libGDX's older 3.3.3 runtime.
    constraints {
        implementation "org.lwjgl:lwjgl:$lwjglVersion"
        implementation "org.lwjgl:lwjgl-glfw:$lwjglVersion"
        implementation "org.lwjgl:lwjgl-jemalloc:$lwjglVersion"
        implementation "org.lwjgl:lwjgl-openal:$lwjglVersion"
        implementation "org.lwjgl:lwjgl-opengl:$lwjglVersion"
        implementation "org.lwjgl:lwjgl-stb:$lwjglVersion"
    }
    implementation "org.jspecify:jspecify:1.0.0"

    implementation project(':services:updates:offlineUpdates')
    implementation project(':services:news:offlineNews')
    testImplementation 'junit:junit:4.13.2'
}
