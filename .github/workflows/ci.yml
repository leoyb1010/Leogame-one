name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test core and desktop
        run: ./gradlew --no-daemon :core:test :desktop:test
      - name: Validate internal release metadata
        run: python3 scripts/validate_release.py
      - name: Verify patch whitespace
        run: git diff --check

  apple-java-build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and package Apple targets
        run: ./gradlew --no-daemon :ios:test :desktop:jpackageImage
