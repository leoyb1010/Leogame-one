name: Bug report
description: 报告崩溃、存档、显示或操作问题
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: [macOS, iPhone, iPad]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 游戏与系统版本
      placeholder: "游戏 1.0.0 / iOS 18.x"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或去敏日志
